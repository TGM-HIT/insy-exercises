x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wordpress
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Trage DB_PASSWORD in .env ein}
  WORDPRESS_CONFIG_EXTRA: |
    define('DISALLOW_FILE_EDIT', true);
    define('WP_ENVIRONMENT_TYPE', 'local');

services:
  db:
    image: mariadb:12.3.3
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?Trage DB_PASSWORD in .env ein}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Trage DB_ROOT_PASSWORD in .env ein}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'mariadb --protocol=tcp -h 127.0.0.1 -u wordpress --password="$${MARIADB_PASSWORD}" wordpress -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  wordpress:
    image: wordpress:7.1.0-php8.5-apache
    ports:
      - "127.0.0.1:${WP_PORT:-8085}:80"
    environment: *wp-env
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',80) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  cli:
    image: wordpress:cli-2.12.0-php8.5
    entrypoint: [wp]
    profiles: [tools]
    user: '33:33'
    environment: *wp-env
    volumes:
      - wordpress_data:/var/www/html
      - ./assets:/material-assets:ro
    depends_on:
      wordpress:
        condition: service_healthy
  archive:
    image: wordpress:cli-2.12.0-php8.5
    profiles: [tools]
    user: '0:0'
    entrypoint: [sh, /scripts/archive.sh]
    environment: *wp-env
    volumes:
      - wordpress_data:/var/www/html
      - ./backups:/backups
      - ./scripts:/scripts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  wordpress_data:
