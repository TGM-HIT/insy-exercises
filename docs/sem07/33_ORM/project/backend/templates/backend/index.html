<body>
<div class="container-lg">
    <h1>Recipe Database</h1>

    <div class="card-group">
    {%  for r in recipes %}
    <div class="card" style="width: 18rem;">
      <div class="card-body">
          <h5 class="card-title">{{ r.name  }}</h5>
          <h6 class="card-subtitle mb-2 text-body-secondary">{{ r.type  }}</h6>
          <p class="card-text">
            <ul>
            {%  for i in r.ingredients %}
                <li><small>{{ i.quantity }} {{ i.unit }}</small> {{ i.name }}</li>
            {%  endfor %}
            </ul>
          </p>
          <p class="card-text">
            {{  r.instructions }}
          </p>
      </div>
    </div>
    {%  endfor %}
    </div>
</div>
</body>
