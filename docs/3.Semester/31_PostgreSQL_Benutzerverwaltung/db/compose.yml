name: insy-useradmin-2026

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: insy-postgres-tls:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-lab-2026}
      POSTGRES_DB: dvdrental
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - hba_file=/etc/postgresql/lab/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      # PostgreSQL 18: mount the parent directory, not the old data path.
      - postgres_data:/var/lib/postgresql
      - tls_data:/tls
      - ./config:/etc/postgresql/lab:ro
      - ./dvdrental.sql:/docker-entrypoint-initdb.d/10-dvdrental.sql:ro
      - ./init/20-lab-baseline.sql:/docker-entrypoint-initdb.d/20-lab-baseline.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d dvdrental"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      lab:
        ipv4_address: 172.30.42.10

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.org
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin-lab-2026}
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.42.40

  client_ok:
    image: postgres:18.6
    command: [sleep, infinity]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.42.20

  client_blocked:
    image: postgres:18.6
    command: [sleep, infinity]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: 172.30.42.30

volumes:
  postgres_data:
  pgadmin_data:
  tls_data:

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.42.0/24
